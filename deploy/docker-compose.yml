name: secure-ask

# Прод-стек secure-ask. Самодостаточен: бот (с веб-панелью) + база.
# Caddy сюда НЕ входит — им занимается отдельный проект edge.
# Веб-панель собрана в образ и отдаётся самим ботом на :8080 (как в chatkeeper).
#
# Требуется общая сеть edge (один раз на сервер): docker network create web
#
# Запуск:
#   docker compose up -d --build

services:
  bot:
    build: ..
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    networks:
      web:
        # По этому имени edge (Caddy) обращается к боту: webhook + /api + панель.
        aliases: [secure-ask-bot]
      internal: {}
    # порт наружу НЕ публикуем — к боту ходит только edge по сети web
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    image: postgres:16-alpine
    container_name: secure-ask-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secureask
      POSTGRES_USER: secureask
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    # наружу не публикуем вообще
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureask"]
      interval: 5s
      retries: 10
    logging: *logging

networks:
  # Общая сеть edge. Создаётся вручную: docker network create web
  web:
    external: true
  internal: {}

volumes:
  pg_data:
    name: deploy_pg_data
